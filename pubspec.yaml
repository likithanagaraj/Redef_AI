name: redef_ai_main
description: "AI first productivity System"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+4
environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_svg: ^2.2.4
  flutter_timezone: ^5.0.1
  intl: ^0.20.2
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  isar_generator: ^3.1.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: ndot
      fonts:
        - asset: assets/fonts/ndot-47-inspired-by-nothing.otf
    - family: TTNormsPro
      fonts:
        - asset: assets/fonts/TT Norms Pro Bold.otf
          weight: 700
        - asset: assets/fonts/TT Norms Pro Medium.otf
          weight: 500
        - asset: assets/fonts/TT Norms Pro Regular.otf
          weight: 400